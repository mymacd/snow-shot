name: line snap test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  model-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: snow_draw_engine_qt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: snow_draw_engine_qt

      - name: Run model tests
        run: cargo test -p snow-draw-engine-model
